# Builds, verifies and deploys the static site to GitHub Pages.
# Required gate: type check, unit tests (incl. privacy policy checks), production build.
# Browser integration tests run separately (browser-tests.yml) because they depend on
# the public PeerJS Cloud and must not be hidden or silently retried here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Verify production privacy configuration
        run: |
          grep -q '<meta name="robots" content="noindex, nofollow"' dist/index.html
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          test ! -e dist/robots.txt
          test ! -e dist/sitemap.xml
          test -z "$(find dist -name '*.map')"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
